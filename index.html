<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HTs Collections · Music Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-container" id="appContainer">

  <!-- HEADER -->
  <div class="app-header">
    <h1><i class="fas fa-headphones-alt"></i> HTs Collections</h1>
    <span>5 albums</span>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    
    <!-- LEFT PANEL: Album Art / Video -->
    <div class="art-panel" id="artPanel">
      <!-- Default: HTC5 Coming Soon -->
      <div class="art-container" id="artContainer">
        <img id="albumArt" src="HTC5.jpg" alt="HTs Collections V" />
        <div class="coming-soon-overlay" id="comingSoonOverlay">
          <div class="coming-soon-badge-large">
            <i class="fas fa-clock"></i> COMING SOON
          </div>
          <div class="coming-soon-info">
            <h2>HTs Collections V</h2>
            <p>HyperSOUL-X · 2026 · 14 tracks</p>
            <span><i class="fas fa-calendar-alt"></i> 25 Sep 2026</span>
          </div>
        </div>
        <!-- Video Player (hidden by default) -->
        <div class="video-wrapper" id="videoWrapper" style="display:none;">
          <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
          </div>
          <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
      </div>
      
      <!-- Now Playing Info (below art on PC, hidden on mobile) -->
      <div class="now-playing-info" id="nowPlayingInfo">
        <div class="np-track" id="npTrack">Select a track to play</div>
        <div class="np-artist" id="npArtist">—</div>
        <div class="np-progress">
          <span class="np-time" id="npTimeCurrent">0:00</span>
          <div class="np-progress-bar">
            <div class="np-progress-fill" id="npProgressFill" style="width:0%"></div>
          </div>
          <span class="np-time" id="npTimeTotal">0:00</span>
        </div>
        <div class="np-controls">
          <i class="fas fa-step-backward" id="npPrev"></i>
          <i class="fas fa-play-circle" id="npPlay"></i>
          <i class="fas fa-step-forward" id="npNext"></i>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Album Selection & Tracklist -->
    <div class="track-panel" id="trackPanel">
      <!-- Album Selection Buttons -->
      <div class="album-selector" id="albumSelector">
        <button class="album-btn active" data-album="0">HTs Collections</button>
        <button class="album-btn" data-album="1">Vol. 2</button>
        <button class="album-btn" data-album="2">Vol. 3</button>
        <button class="album-btn" data-album="3">Vol. 4</button>
        <button class="album-btn coming-soon-btn" data-album="4">Vol. 5</button>
      </div>
      
      <!-- Tracklist -->
      <div class="tracklist-container" id="tracklistContainer">
        <div class="tracklist-header">
          <span class="track-num">#</span>
          <span class="track-title-col">Title</span>
          <span class="track-artist-col">Artist</span>
          <span class="track-duration">⏱</span>
        </div>
        <div class="tracklist" id="tracklist">
          <!-- Tracks rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- MOBILE MINI PLAYER (visible on mobile only) -->
  <div class="mobile-mini-player" id="mobileMiniPlayer">
    <div class="mobile-mini-left" id="mobileMiniLeft">
      <img id="mobileMiniArt" src="HTC5.jpg" alt="Now Playing" />
      <div class="mobile-mini-info">
        <div class="mobile-mini-title" id="mobileMiniTitle">Select a track</div>
        <div class="mobile-mini-artist" id="mobileMiniArtist">—</div>
      </div>
    </div>
    <div class="mobile-mini-controls">
      <i class="fas fa-play-circle" id="mobileMiniPlay"></i>
      <i class="fas fa-forward" id="mobileMiniNext"></i>
    </div>
    <div class="mobile-mini-expand" id="mobileMiniExpand">
      <i class="fas fa-chevron-up"></i>
    </div>
  </div>

  <!-- MOBILE FULL PLAYER -->
  <div class="mobile-full-player" id="mobileFullPlayer">
    <div class="mobile-full-header">
      <i class="fas fa-chevron-down" id="mobileFullClose"></i>
      <span>Now Playing</span>
      <i class="fas fa-ellipsis-h"></i>
    </div>
    <div class="mobile-full-art">
      <img id="mobileFullArt" src="HTC5.jpg" alt="Now Playing" />
      <div class="mobile-full-video">
        <iframe id="mobileFullIframe" src="" allowfullscreen></iframe>
      </div>
    </div>
    <div class="mobile-full-info">
      <div class="mobile-full-title" id="mobileFullTitle">Select a track</div>
      <div class="mobile-full-artist" id="mobileFullArtist">—</div>
    </div>
    <div class="mobile-full-progress">
      <span class="mobile-time" id="mobileTimeCurrent">0:00</span>
      <div class="mobile-progress-bar">
        <div class="mobile-progress-fill" id="mobileProgressFill" style="width:0%"></div>
      </div>
      <span class="mobile-time" id="mobileTimeTotal">0:00</span>
    </div>
    <div class="mobile-full-controls">
      <i class="fas fa-step-backward" id="mobileFullPrev"></i>
      <i class="fas fa-play-circle" id="mobileFullPlay"></i>
      <i class="fas fa-step-forward" id="mobileFullNext"></i>
    </div>
  </div>
</div>

<script src="data.json" type="application/json" id="dataJson"></script>
<script>
  fetch('data.json')
    .then(response => response.json())
    .then(data => initPlayer(data))
    .catch(err => {
      console.error('Error loading data.json:', err);
      const jsonScript = document.getElementById('dataJson');
      if (jsonScript) {
        try {
          const data = JSON.parse(jsonScript.textContent);
          initPlayer(data);
        } catch (e) {
          console.error('Fallback failed:', e);
        }
      }
    });

  function initPlayer(data) {
    const albums = data.albums;
    const comingSoon = data.comingSoon;
    const allAlbums = [...albums, { ...comingSoon, id: 'htc5', isComingSoon: true }];

    let currentAlbum = null;
    let currentTrack = null;
    let currentTrackIndex = 0;
    let isPlaying = false;

    // DOM refs
    const albumArt = document.getElementById('albumArt');
    const comingSoonOverlay = document.getElementById('comingSoonOverlay');
    const videoWrapper = document.getElementById('videoWrapper');
    const videoPlayer = document.getElementById('videoPlayer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const tracklist = document.getElementById('tracklist');
    const albumSelector = document.getElementById('albumSelector');
    const npTrack = document.getElementById('npTrack');
    const npArtist = document.getElementById('npArtist');
    const npProgressFill = document.getElementById('npProgressFill');
    const npTimeCurrent = document.getElementById('npTimeCurrent');
    const npTimeTotal = document.getElementById('npTimeTotal');
    const npPlay = document.getElementById('npPlay');
    const npPrev = document.getElementById('npPrev');
    const npNext = document.getElementById('npNext');

    // Mobile refs
    const mobileMiniPlayer = document.getElementById('mobileMiniPlayer');
    const mobileMiniArt = document.getElementById('mobileMiniArt');
    const mobileMiniTitle = document.getElementById('mobileMiniTitle');
    const mobileMiniArtist = document.getElementById('mobileMiniArtist');
    const mobileMiniPlay = document.getElementById('mobileMiniPlay');
    const mobileMiniNext = document.getElementById('mobileMiniNext');
    const mobileMiniExpand = document.getElementById('mobileMiniExpand');
    const mobileFullPlayer = document.getElementById('mobileFullPlayer');
    const mobileFullArt = document.getElementById('mobileFullArt');
    const mobileFullIframe = document.getElementById('mobileFullIframe');
    const mobileFullTitle = document.getElementById('mobileFullTitle');
    const mobileFullArtist = document.getElementById('mobileFullArtist');
    const mobileFullPlay = document.getElementById('mobileFullPlay');
    const mobileFullPrev = document.getElementById('mobileFullPrev');
    const mobileFullNext = document.getElementById('mobileFullNext');
    const mobileFullClose = document.getElementById('mobileFullClose');
    const mobileProgressFill = document.getElementById('mobileProgressFill');
    const mobileTimeCurrent = document.getElementById('mobileTimeCurrent');
    const mobileTimeTotal = document.getElementById('mobileTimeTotal');

    let currentAlbumIndex = 0;
    let progressInterval = null;
    let progress = 0;

    // Render album selector buttons
    function renderAlbumSelector() {
      const btnLabels = ['HTs Collections', 'Vol. 2', 'Vol. 3', 'Vol. 4', 'Vol. 5'];
      albumSelector.innerHTML = allAlbums.map((album, idx) => {
        const isComingSoon = album.isComingSoon;
        return `<button class="album-btn ${idx === 0 ? 'active' : ''} ${isComingSoon ? 'coming-soon-btn' : ''}" data-album="${idx}">
          ${btnLabels[idx]} ${isComingSoon ? '🔜' : ''}
        </button>`;
      }).join('');

      albumSelector.querySelectorAll('.album-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.album);
          loadAlbum(idx);
        });
      });
    }

    // Load album
    function loadAlbum(index) {
      currentAlbumIndex = index;
      const album = allAlbums[index];
      currentAlbum = album;
      currentTrack = null;
      currentTrackIndex = 0;
      isPlaying = false;

      // Update active button
      albumSelector.querySelectorAll('.album-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      // Update art panel
      if (album.isComingSoon) {
        albumArt.style.display = 'block';
        albumArt.src = album.cover;
        comingSoonOverlay.style.display = 'flex';
        videoWrapper.style.display = 'none';
        videoPlayer.src = '';
        // Update now playing info
        npTrack.textContent = 'Coming Soon';
        npArtist.textContent = `${album.artist} · ${album.year}`;
        npTimeCurrent.textContent = '0:00';
        npTimeTotal.textContent = '0:00';
        npProgressFill.style.width = '0%';
        // Mobile mini
        mobileMiniArt.src = album.cover;
        mobileMiniTitle.textContent = 'Coming Soon';
        mobileMiniArtist.textContent = `${album.artist} · ${album.year}`;
      } else {
        // Show album art with no video
        albumArt.style.display = 'block';
        albumArt.src = album.cover;
        comingSoonOverlay.style.display = 'none';
        videoWrapper.style.display = 'none';
        videoPlayer.src = '';
        npTrack.textContent = 'Select a track';
        npArtist.textContent = `${album.artist} · ${album.year}`;
        mobileMiniArt.src = album.cover;
        mobileMiniTitle.textContent = 'Select a track';
        mobileMiniArtist.textContent = `${album.artist} · ${album.year}`;
      }

      // Render tracklist
      renderTracklist(album);
      updatePlayButton();
    }

    // Render tracklist
    function renderTracklist(album) {
      if (!album || album.isComingSoon) {
        tracklist.innerHTML = `
          <div class="track-item coming-soon-track">
            <span class="track-num">🎵</span>
            <span class="track-title-col">Coming Soon</span>
            <span class="track-artist-col">${album ? album.artist : '—'}</span>
            <span class="track-duration">—</span>
          </div>
        `;
        return;
      }

      tracklist.innerHTML = album.tracks.map((track, idx) => {
        const isActive = currentTrack === track;
        const displayTitle = track.mix ? `${track.title} (${track.mix})` : track.title;
        return `
          <div class="track-item ${isActive ? 'active' : ''}" data-track-index="${idx}">
            <span class="track-num">${idx + 1}</span>
            <span class="track-title-col">${displayTitle}</span>
            <span class="track-artist-col">${track.artist}</span>
            <span class="track-duration">▶</span>
          </div>
        `;
      }).join('');

      tracklist.querySelectorAll('.track-item').forEach(item => {
        item.addEventListener('click', function() {
          const idx = parseInt(this.dataset.trackIndex);
          playTrack(idx);
        });
      });
    }

    // Play track
    function playTrack(index) {
      if (!currentAlbum || currentAlbum.isComingSoon) return;
      
      const track = currentAlbum.tracks[index];
      if (!track) return;
      
      currentTrack = track;
      currentTrackIndex = index;
      isPlaying = true;
      progress = 0;

      // Show video
      albumArt.style.display = 'none';
      comingSoonOverlay.style.display = 'none';
      videoWrapper.style.display = 'block';
      loadingOverlay.style.display = 'flex';
      
      const videoId = track.url;
      const videoSrc = `https://www.youtube.com/embed/${videoId}?controls=0&modestbranding=1&rel=0&enablejsapi=1&autoplay=1`;
      videoPlayer.src = videoSrc;
      mobileFullIframe.src = videoSrc;

      // Update now playing info
      const displayTitle = track.mix ? `${track.title} (${track.mix})` : track.title;
      npTrack.textContent = displayTitle;
      npArtist.textContent = track.artist;
      mobileMiniTitle.textContent = displayTitle;
      mobileMiniArtist.textContent = track.artist;
      mobileFullTitle.textContent = displayTitle;
      mobileFullArtist.textContent = track.artist;
      mobileMiniArt.src = currentAlbum.cover;
      mobileFullArt.src = currentAlbum.cover;

      // Hide loading after 1.5s
      setTimeout(() => {
        loadingOverlay.style.display = 'none';
      }, 1500);

      // Update tracklist highlight
      renderTracklist(currentAlbum);
      updatePlayButton();

      // Start progress simulation
      startProgress();
    }

    // Progress simulation
    function startProgress() {
      if (progressInterval) clearInterval(progressInterval);
      progress = 0;
      progressInterval = setInterval(() => {
        if (isPlaying) {
          progress = (progress + 0.5) % 100;
          npProgressFill.style.width = progress + '%';
          mobileProgressFill.style.width = progress + '%';
          const mins = Math.floor(progress / 100 * 3.5);
          const secs = Math.floor((progress / 100 * 3.5 - mins) * 60);
          npTimeCurrent.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
          mobileTimeCurrent.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }
      }, 500);
    }

    // Toggle play/pause
    function togglePlay() {
      if (!currentTrack) return;
      isPlaying = !isPlaying;
      if (isPlaying) {
        let src = videoPlayer.src;
        if (src.includes('autoplay=1')) {
          videoPlayer.src = videoPlayer.src;
        } else {
          videoPlayer.src = src + (src.includes('?') ? '&autoplay=1' : '?autoplay=1');
        }
        mobileFullIframe.src = videoPlayer.src;
      } else {
        const src = videoPlayer.src.replace('&autoplay=1', '').replace('?autoplay=1', '');
        videoPlayer.src = src;
        mobileFullIframe.src = src;
      }
      updatePlayButton();
    }

    function updatePlayButton() {
      const icon = isPlaying ? 'fa-pause-circle' : 'fa-play-circle';
      npPlay.className = `fas ${icon}`;
      mobileMiniPlay.className = `fas ${icon}`;
      mobileFullPlay.className = `fas ${icon}`;
    }

    function nextTrack() {
      if (!currentAlbum || currentAlbum.isComingSoon) return;
      const newIndex = (currentTrackIndex + 1) % currentAlbum.tracks.length;
      playTrack(newIndex);
    }

    function prevTrack() {
      if (!currentAlbum || currentAlbum.isComingSoon) return;
      const newIndex = (currentTrackIndex - 1 + currentAlbum.tracks.length) % currentAlbum.tracks.length;
      playTrack(newIndex);
    }

    // Mobile full player toggle
    function openMobileFull() {
      mobileFullPlayer.classList.add('active');
    }

    function closeMobileFull() {
      mobileFullPlayer.classList.remove('active');
    }

    // Event listeners
    npPlay.addEventListener('click', togglePlay);
    npPrev.addEventListener('click', prevTrack);
    npNext.addEventListener('click', nextTrack);
    
    mobileMiniPlay.addEventListener('click', togglePlay);
    mobileMiniNext.addEventListener('click', nextTrack);
    mobileMiniExpand.addEventListener('click', openMobileFull);
    
    mobileFullPlay.addEventListener('click', togglePlay);
    mobileFullPrev.addEventListener('click', prevTrack);
    mobileFullNext.addEventListener('click', nextTrack);
    mobileFullClose.addEventListener('click', closeMobileFull);

    // Initialize
    renderAlbumSelector();
    loadAlbum(0);

    // Handle window resize for mobile/PC
    function handleResize() {
      const isMobile = window.innerWidth <= 860;
      document.querySelector('.main-content').style.flexDirection = isMobile ? 'column' : 'row';
    }
    handleResize();
    window.addEventListener('resize', handleResize);

    console.log('HTs Collections Player ready!');
  }
</script>
</body>
</html>
